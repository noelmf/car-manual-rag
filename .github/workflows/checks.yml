name: checks

# The rules the pre-commit hook enforces, run where nobody can skip them: the
# hook only applies to checkouts that ran `git config core.hooksPath hooks`.
#
# The web job has no hook behind it at all, so this is the only place the
# front-end's types and tests are checked.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the newest stable release.
        # Claiming >=3.10 without testing 3.10 is a claim, not a fact.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff format --check .

      - run: ruff check .

      # fail_under lives in pyproject.toml, so this fails on its own if
      # coverage drops below the floor -- before anything reaches Codecov.
      - run: pytest --cov --cov-report=xml --cov-report=term

      # One upload per commit is enough; the report is identical across the
      # matrix and two uploads only make Codecov merge them back together.
      #
      # The flag keeps this figure apart from the web one. Merged, a front end
      # of two files would vanish inside a backend of eight hundred statements
      # and a drop there would never show.
      - if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: true

  web:
    # Its own job rather than more steps on the Python one: they share no
    # tooling, and a failure in either should not hide the other.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from web/package.json's packageManager field,
      # so it is declared once and CI follows the checkout.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile: CI installs what the lockfile says or it fails,
      # rather than quietly resolving something else.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Measures coverage as it goes, the way `pytest --cov` does on the
      # other side, so the documented command is the same one CI runs.
      - run: pnpm test

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: true

      # tsc runs again inside this, which is cheap and worth it: a build also
      # catches what type checking alone does not, such as an import that
      # resolves for the checker but not for the bundler.
      - run: pnpm build
