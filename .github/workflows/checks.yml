name: checks

# The same rules the pre-commit hook enforces, run where nobody can skip them:
# the hook only applies to checkouts that ran `git config core.hooksPath hooks`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the newest stable release.
        # Claiming >=3.10 without testing 3.10 is a claim, not a fact.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff format --check .

      - run: ruff check .

      # fail_under lives in pyproject.toml, so this fails on its own if
      # coverage drops below the floor -- before anything reaches Codecov.
      - run: pytest --cov --cov-report=xml --cov-report=term

      # One upload per commit is enough; the report is identical across the
      # matrix and two uploads only make Codecov merge them back together.
      - if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
