[project]
name = "car-manual-rag"
version = "0.1.0"
description = "RAG over car owner's manuals"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
crag-download = "car_manual_rag.ingest.download:main"
crag-extract = "car_manual_rag.ingest.text:main"
crag-chunk = "car_manual_rag.ingest.chunk:main"
crag-catalog = "car_manual_rag.ingest.catalog:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
